{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block body %}
<main class="auth">
  <form method="post" action="/setup" class="auth-card">
    <div class="auth-logo">{{ icon('logo') }}</div>
    <h1>欢迎使用 Email Vault</h1>
    <p class="hint">先设置一个主密码，用来加密所有保存的密码。<br><strong>主密码忘记后无法恢复</strong>，请妥善保管。</p>
    {% if err %}<p class="inline-err">{{ err }}</p>{% endif %}
    <label>主密码（至少 {{ min_len }} 位）
      <input type="password" name="password" minlength="{{ min_len }}" required autofocus autocomplete="new-password">
    </label>
    <label>确认主密码
      <input type="password" name="confirm" minlength="{{ min_len }}" required autocomplete="new-password">
    </label>
    <button type="submit" class="primary block">创建保险库</button>
  </form>
</main>
{% endblock %}
