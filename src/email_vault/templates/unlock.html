{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block body %}
<main class="auth">
  <form method="post" action="/unlock" class="auth-card">
    <div class="auth-logo">{{ icon('lock') }}</div>
    <h1>Email Vault 已锁定</h1>
    <p class="hint">输入主密码以解锁</p>
    {% if err %}<p class="inline-err">{{ err }}</p>{% endif %}
    <label class="sr-label">主密码
      <input type="password" name="password" required autofocus autocomplete="current-password" placeholder="主密码">
    </label>
    <button type="submit" class="primary block">解锁</button>
  </form>
</main>
{% endblock %}
